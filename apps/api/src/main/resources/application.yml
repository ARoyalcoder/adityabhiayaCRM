# Technical settings only. Configurable business rules live in the database
# (project rule 5, docs/architecture/04-backend-architecture.md).
spring:
  application:
    name: business-os-api
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      pool-name: bos-pool
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway migrations; Hibernate only checks that
      # entities match it (D-05.4).
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: platform
    default-schema: platform
    validate-on-migrate: true
    # Forward-only: a changed migration file must be a new file.
    clean-disabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: native
  tomcat:
    max-http-form-post-size: 1MB

app:
  name: Pawan Putra Business OS
  version: ${APP_VERSION:0.1.0-SNAPSHOT}

management:
  endpoints:
    web:
      exposure:
        # Reached on the internal network only; Nginx does not proxy /actuator
        # (docs/architecture/12-deployment-architecture.md).
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /api/v1/docs/openapi
  swagger-ui:
    path: /api/v1/docs

logging:
  level:
    root: INFO
    com.pawanputra.bos: INFO
