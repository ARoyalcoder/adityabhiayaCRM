# Technical settings only. Configurable business rules live in the database
# (project rule 5, docs/architecture/04-backend-architecture.md).
spring:
  application:
    name: business-os-api
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      pool-name: bos-pool
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway migrations; Hibernate only checks that
      # entities match it (D-05.4).
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: platform
    default-schema: platform
    validate-on-migrate: true
    # Forward-only: a changed migration file must be a new file.
    clean-disabled: true
  data:
    redis:
      # Cache and short-lived counters only; never the system of record
      # (docs/architecture/01-system-architecture.md).
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2s
      connect-timeout: 2s
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: native
  tomcat:
    max-http-form-post-size: 1MB

app:
  name: Pawan Putra Business OS
  version: ${APP_VERSION:0.1.0-SNAPSHOT}

management:
  endpoints:
    web:
      exposure:
        # Reached on the internal network only; Nginx does not proxy /actuator
        # (docs/architecture/12-deployment-architecture.md).
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      # Component statuses (UP/DOWN) are listed; their details (hosts,
      # versions, error messages) never are.
      show-components: always
      show-details: never
      group:
        # Readiness includes the database and Redis, so Docker and Nginx only
        # send traffic to an instance that can reach both. Liveness does not:
        # a Redis outage must not get the container restarted.
        readiness:
          include: readinessState,db,redis
        liveness:
          include: livenessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /api/v1/docs/openapi
  swagger-ui:
    path: /api/v1/docs

logging:
  # Structured JSON (Elastic Common Schema) on stdout in every environment
  # (docs/architecture/12-deployment-architecture.md). The request id is in the
  # MDC and appears as the "requestId" field. Set LOG_FORMAT to logstash or
  # gelf to change the schema.
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
    ecs:
      service:
        name: business-os-api
        version: ${APP_VERSION:0.1.0-SNAPSHOT}
        environment: local
  level:
    root: INFO
    com.pawanputra.bos: INFO
