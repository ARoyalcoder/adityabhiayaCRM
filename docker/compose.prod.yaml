# Production / staging topology, as described in
# docs/architecture/12-deployment-architecture.md.
#
# Every value comes from the environment file passed with --env-file; no
# secret is committed. MinIO is added in the step that needs it.
name: pawanputra-bos

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Not published on the host: only the app container reaches it.
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    # Cache and short-lived counters only: no persistence, safe to lose.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?required}", "--save", "", "--appendonly", "no"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    expose:
      - "6379"

  api:
    image: ${API_IMAGE:?required}
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JAVA_TOOL_OPTIONS: ${API_JAVA_OPTS:--XX:MaxRAMPercentage=75}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Flyway runs during startup, so readiness turns UP only once the
      # schema is migrated and PostgreSQL and Redis both answer.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    expose:
      - "8080"

  web:
    image: ${WEB_IMAGE:?required}
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      # Serves the SPA and reaches the backend through the /api proxy.
      test: ["CMD", "wget", "-qO-", "http://localhost/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
