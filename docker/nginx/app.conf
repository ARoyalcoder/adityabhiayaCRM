# TLS is terminated here in production; the certificate and the server_name are
# environment-specific and are added when the production host is set up
# (docs/architecture/12-deployment-architecture.md).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    # Security headers. The SPA ships no inline scripts.
    include /etc/nginx/conf.d/security-headers.inc;

    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # Vite emits hashed file names, so built assets can be cached forever.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://api:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # Actuator is internal only and is deliberately not proxied.
    location /actuator {
        return 404;
    }

    # Client-side routing: unknown paths return the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
