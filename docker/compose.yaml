# Local development environment.
#
#   docker compose --env-file .env -f docker/compose.yaml up -d
#       PostgreSQL and Redis only. Run the backend and the Vite dev server on
#       the host for hot reload (npm run dev:api, npm run dev:web).
#
#   docker compose --env-file .env -f docker/compose.yaml --profile app up -d --build
#       Also builds and runs the backend and frontend containers, the same
#       images as production (docs/architecture/12-deployment-architecture.md).
name: pawanputra-bos-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: bos-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bos}
      POSTGRES_USER: ${POSTGRES_USER:-bos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bos} -d ${POSTGRES_DB:-bos}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bos-redis
    # Cache and short-lived counters only: no persistence
    # (docs/architecture/12-deployment-architecture.md).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  api:
    profiles: ["app"]
    image: bos-api:dev
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: bos-api
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bos}
      DB_USERNAME: ${POSTGRES_USER:-bos}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  web:
    profiles: ["app"]
    image: bos-web:dev
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    container_name: bos-web
    ports:
      - "127.0.0.1:${WEB_CONTAINER_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Serves the SPA and reaches the backend through the /api proxy.
      test: ["CMD", "wget", "-qO-", "http://localhost/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
